# Compila la app con cada push a main y la sube a Firebase App Distribution,
# para que llegue la actualización al celular a través de Firebase App Tester.
name: Distribuir app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: distribuir-app
  cancel-in-progress: true

jobs:
  distribuir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # +1 para que la primera versión ya sea mayor que la instalada desde Android Studio (versionCode 1)
      VERSION_CODE: ${{ github.run_number + 1 }}
      KEYSTORE_PATH: ${{ github.workspace }}/distribucion.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar plataforma Android 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null

      - name: Restaurar clave de firma
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"

      - name: Compilar APK
        run: ./gradlew assembleRelease --console=plain

      - name: Subir a Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          printf '%s' "${COMMIT_MESSAGE:-Compilación manual}" > "$RUNNER_TEMP/notas.txt"
          npx --yes firebase-tools@14.2.0 appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups testers \
            --release-notes-file "$RUNNER_TEMP/notas.txt"
