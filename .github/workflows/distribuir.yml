# Compila la app con cada push a main y la sube a Firebase App Distribution,
# para que llegue la actualización al celular a través de Firebase App Tester.
name: Distribuir app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: distribuir-app
  cancel-in-progress: true

jobs:
  distribuir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/distribucion.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Instalar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Verificar secretos
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          faltan=""
          for nombre in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD FIREBASE_SERVICE_ACCOUNT FIREBASE_APP_ID; do
            [ -n "${!nombre}" ] || faltan="$faltan $nombre"
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan estos secretos en Settings > Secrets and variables > Actions:$faltan"
            exit 1
          fi

      - name: Revisar cuenta de servicio
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if ! printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -e . > /dev/null 2>&1; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT no es un JSON válido. Pega el contenido completo del archivo .json, desde la primera { hasta la última }"
            exit 1
          fi
          tipo=$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -r '.type // empty')
          if [ "$tipo" != "service_account" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT no es una clave de cuenta de servicio (type='$tipo'). Usa el .json descargado en Google Cloud > Cuentas de servicio > Claves, no google-services.json"
            exit 1
          fi
          for campo in private_key client_email project_id; do
            if [ -z "$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -r ".$campo // empty")" ]; then
              echo "::error::Al JSON de FIREBASE_SERVICE_ACCOUNT le falta el campo '$campo'"
              exit 1
            fi
          done
          echo "Proyecto de la cuenta de servicio: $(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -r .project_id)"

      # El nombre del paquete puede ser android-37 o llevar versión menor (android-37.0), así que se busca en la lista
      - name: Instalar plataforma Android 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          paquete=$("$SDKMANAGER" --list 2>/dev/null | awk '{print $1}' | grep -E '^platforms;android-37(\.[0-9]+)?$' | sort -uV | tail -n 1)
          if [ -z "$paquete" ]; then
            echo "::warning::No se encontró la plataforma 37 en sdkmanager; Gradle intentará descargarla"
            "$SDKMANAGER" --list 2>/dev/null | grep 'platforms;android-3' | sort -u
            exit 0
          fi
          echo "Instalando $paquete"
          yes | "$SDKMANAGER" "$paquete" > /dev/null || true
          "$SDKMANAGER" --list_installed 2>/dev/null | grep "$paquete"

      # +1 para que la primera versión ya sea mayor que la instalada desde Android Studio (versionCode 1)
      - name: Calcular versionCode
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"

      - name: Restaurar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$KEYSTORE_PATH"

      - name: Compilar APK
        run: ./gradlew assembleRelease --console=plain

      - name: Autenticar con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Subir a Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          printf '%s' "${COMMIT_MESSAGE:-Compilación manual}" > "$RUNNER_TEMP/notas.txt"
          npx --yes firebase-tools@14.2.0 appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups testers \
            --release-notes-file "$RUNNER_TEMP/notas.txt"
